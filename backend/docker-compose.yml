services:
  db:
    image: pgvector/pgvector:pg16
    container_name: autodev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autodev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodev}
      POSTGRES_DB: ${POSTGRES_DB:-autodev}
    ports:
      # 5433 on the host so it won't clash with a locally installed Postgres
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only when the volume is empty
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
